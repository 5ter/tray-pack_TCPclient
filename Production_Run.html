<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Production run status</title>
  <style>
    :root { font-family: Segoe UI, Arial, sans-serif; color: #162033; background: #f3f6fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 760px); background: white; border-radius: 18px; padding: 32px; box-shadow: 0 16px 50px #17345c1c; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .indicators { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }
    .indicator { display: inline-flex; align-items: center; min-height: 30px; padding: 5px 10px; border-radius: 16px; font-size: 13px; font-weight: 650; }
    .indicator.connected { color: #067647; background: #e9f8ef; }
    .indicator.disconnected { color: #b42318; background: #fff0ed; }
    .indicator.connecting, .indicator.unavailable { color: #637189; background: #f1f4f8; }
    h1 { margin: 0; font-size: 28px; }
    #partNumber { margin: 24px 0 4px; font-size: clamp(26px, 6vw, 42px); font-weight: 750; overflow-wrap: anywhere; }
    .muted { color: #637189; }
    .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 28px; }
    .card { border-radius: 14px; padding: 24px; text-align: center; background: #f4f7fb; }
    .card.ok { background: #e9f8ef; color: #067647; }
    .card.ng { background: #fff0ed; color: #b42318; }
    .number { display: block; margin-top: 8px; font-size: 42px; font-weight: 750; }
    a { display: flex; align-items: center; justify-content: center; width: max-content; margin: 24px auto 0; padding: 12px 16px; border-radius: 9px; color: white; background: #155eef; text-decoration: none; font-weight: 650; text-align: center; }
    #status { min-height: 24px; margin-top: 16px; color: #637189; }
    @media (max-width: 560px) { .counts { grid-template-columns: 1fr; } .card { padding: 16px; } .number { font-size: 34px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Production run</h1>
      <div class="indicators" aria-live="polite">
        <span id="connection" class="indicator connecting">Data server: Connecting…</span>
        <span id="plcConnection" class="indicator connecting">PLC: Connecting…</span>
      </div>
    </header>
    <div id="partNumber">Loading run…</div>
    <div id="operatorInfo" class="muted"></div>
    <div id="runInfo" class="muted"></div>
    <section class="counts" aria-live="polite">
      <div class="card ok">OK<span id="okCount" class="number">0</span></div>
      <div class="card ng">NG<span id="ngCount" class="number">0</span></div>
      <div class="card">Total inspected<span id="totalCount" class="number">0</span></div>
    </section>
    <div id="plcDetail" class="muted" role="status">Waiting for the first successful PLC poll.</div>
    <div id="status" role="status"></div>
    <a href="/Production_Select.html">Change part / start a new run</a>
  </main>
  <script src="/ui_helpers.js"></script>
  <script>
    const REFRESH_INTERVAL_MS = 3000;
    let polling = false;
    let plcPolling = false;

    function setIndicator(element, state, text) {
      element.textContent = text;
      element.classList.remove('connected', 'disconnected', 'connecting', 'unavailable');
      element.classList.add(state);
    }

    function formatPlcTime(value) {
      if (!value) return '';
      const time = new Date(value);
      if (Number.isNaN(time.getTime())) return '';
      return time.toLocaleString('en-MY', {
        timeZone: 'Asia/Kuala_Lumpur', dateStyle: 'short', timeStyle: 'medium'
      });
    }

    async function refreshRun() {
      if (polling) return;
      polling = true;
      const connection = document.getElementById('connection');
      const status = document.getElementById('status');
      try {
        const data = await fetchJson('/api/run-summary', { cache: 'no-store' });
        if (!data.active) {
          window.location.href = '/Production_Select.html';
          return;
        }
        document.getElementById('partNumber').textContent = data.part_number;
        document.getElementById('operatorInfo').textContent = `Operator: ${data.operator_name || 'Unknown'}`;
        document.getElementById('runInfo').textContent = `Run ${data.run_id} · Started ${new Date(data.started_at_utc).toLocaleString()}`;
        document.getElementById('okCount').textContent = data.okCount;
        document.getElementById('ngCount').textContent = data.ngCount;
        document.getElementById('totalCount').textContent = data.totalCount;
        setIndicator(connection, 'connected', 'Data server: Connected');
        status.textContent = 'Server-confirmed counts refresh automatically every 3 seconds.';
      } catch (error) {
        setIndicator(connection, 'unavailable', 'Data server: Unavailable');
        status.textContent = `${operatorErrorMessage(error)} Counts will refresh when the server responds.`;
      } finally {
        polling = false;
      }
    }

    async function refreshPlcStatus() {
      if (plcPolling) return;
      plcPolling = true;
      const badge = document.getElementById('plcConnection');
      const detail = document.getElementById('plcDetail');
      try {
        const data = await fetchJson('/api/plc-status', { cache: 'no-store' });
        if (data.connected) {
          setIndicator(badge, 'connected', 'PLC: Connected');
          const lastSuccess = formatPlcTime(data.lastSuccessUtc);
          detail.textContent = lastSuccess
            ? `M7/M8 polling is responding. Last successful PLC poll: ${lastSuccess}.`
            : 'M7/M8 polling is responding.';
        } else if (data.state === 'connecting') {
          setIndicator(badge, 'connecting', 'PLC: Connecting…');
          detail.textContent = 'Waiting for the first successful M7/M8 poll.';
        } else {
          setIndicator(badge, 'disconnected', 'PLC: Disconnected');
          const lastSuccess = formatPlcTime(data.lastSuccessUtc);
          detail.textContent = lastSuccess
            ? `PLC polling failed. Last successful poll: ${lastSuccess}. Check the PC client log for details.`
            : 'No successful PLC poll yet. Check PLC power/network and the PC client log.';
        }
      } catch {
        setIndicator(badge, 'unavailable', 'PLC: Status unavailable');
        detail.textContent = 'The PC could not read its PLC polling status.';
      } finally {
        plcPolling = false;
      }
    }

    refreshRun();
    refreshPlcStatus();
    window.setInterval(refreshRun, REFRESH_INTERVAL_MS);
    window.setInterval(refreshPlcStatus, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
