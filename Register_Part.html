<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register part number</title>
  <style>
    :root { font-family: Segoe UI, Arial, sans-serif; color: #162033; background: #f3f6fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 500px); background: white; border-radius: 18px; padding: 32px; box-shadow: 0 16px 50px #17345c1c; }
    h1 { margin-top: 0; }
    p { color: #637189; line-height: 1.5; }
    label { display: block; margin: 24px 0 8px; font-weight: 650; }
    input { width: 100%; padding: 13px 14px; border: 1px solid #cbd5e1; border-radius: 9px; font: inherit; }
    button, a { display: inline-block; cursor: pointer; border: 0; border-radius: 9px; padding: 13px 16px; font: inherit; font-weight: 650; text-decoration: none; }
    button { width: 100%; margin-top: 18px; color: white; background: #155eef; }
    a { margin-top: 10px; color: #274060; background: #eaf0f8; }
    #message { min-height: 24px; margin-top: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Register a part number</h1>
    <p>Part numbers must be unique. The new entry will appear in the production list.</p>
    <form id="registerForm">
      <label for="partNumber">Part number</label>
      <input id="partNumber" maxlength="100" required autocomplete="off">
      <button id="saveButton" type="submit">Register part</button>
    </form>
    <div id="message" role="status"></div>
    <a href="/Production_Select.html">Back to production</a>
  </main>
  <script>
    const DB_API_URL = 'http://192.168.40.29:3168';
    const form = document.getElementById('registerForm');
    const message = document.getElementById('message');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('saveButton');
      button.disabled = true;
      message.textContent = 'Registering…';
      try {
        const response = await fetch(`${DB_API_URL}/register-part`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ partNumber: document.getElementById('partNumber').value.trim() })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Registration failed.');
        message.textContent = `Registered ${data.partNumber}. Returning to production selection…`;
        window.setTimeout(() => { window.location.href = '/Production_Select.html'; }, 900);
      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
