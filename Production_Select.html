<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start production run</title>
  <style>
    :root { font-family: Segoe UI, Arial, sans-serif; color: #162033; background: #f3f6fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 520px); background: white; border-radius: 18px; padding: 32px; box-shadow: 0 16px 50px #17345c1c; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #637189; line-height: 1.5; }
    label { display: block; margin: 24px 0 8px; font-weight: 650; }
    select, input { width: 100%; padding: 13px 14px; border: 1px solid #cbd5e1; border-radius: 9px; font: inherit; background: white; }
    button, .button { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border: 0; border-radius: 9px; padding: 13px 16px; font: inherit; font-weight: 650; text-align: center; text-decoration: none; }
    .primary { width: 100%; margin-top: 18px; color: white; background: #155eef; }
    .secondary { color: #274060; background: #eaf0f8; }
    .row { display: flex; gap: 10px; margin-top: 12px; }
    .row > * { flex: 1; }
    .part-picker { position: relative; }
    .part-picker[hidden], .part-dropdown[hidden] { display: none; }
    .part-picker-toggle { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 14px; border: 1px solid #cbd5e1; border-radius: 9px; color: #162033; background: white; font: inherit; text-align: left; }
    .part-dropdown { position: absolute; z-index: 10; top: calc(100% + 5px); left: 0; width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 10px; background: white; box-shadow: 0 12px 28px #17345c26; }
    #partSearch { padding: 10px 12px; }
    #partOptions { max-height: 220px; margin-top: 8px; overflow-y: auto; }
    .part-option { display: block; width: 100%; border-radius: 6px; padding: 10px; color: #162033; background: white; text-align: left; font-weight: 400; }
    .part-option:hover, .part-option:focus, .part-option[aria-selected="true"] { outline: none; background: #edf4ff; }
    #partSearchStatus { min-height: 20px; margin: 8px 2px 2px; color: #637189; font-size: 13px; }
    #message { min-height: 24px; margin-top: 14px; color: #475467; text-align: center; }
    #message.error, #loginMessage.error { color: #b42318; }
    .modal { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: #101828aa; }
    .modal[hidden] { display: none; }
    .dialog { width: min(100%, 400px); border-radius: 14px; padding: 24px; background: white; text-align: center; }
    .dialog label { margin-top: 14px; }
    .dialog button { display: flex; width: 100%; margin: 14px auto 0; }
    .dialog .secondary { margin-top: 10px; }
  </style>
</head>
<body>
  <main>
    <h1>Production run</h1>
    <p>Select the registered part number to begin. Every new start creates a fresh run and resets the on-screen run counts.</p>
    <form id="startForm">
      <label for="operatorName">Operator name / ID</label>
      <input id="operatorName" maxlength="100" required autocomplete="off" placeholder="Enter your name or ID">
      <label id="partNumberLabel">Part number</label>
      <div id="partPicker" class="part-picker" hidden>
        <input id="partNumber" type="hidden" name="partNumber">
        <button id="partPickerToggle" class="part-picker-toggle" type="button" aria-haspopup="listbox" aria-controls="partOptions" aria-expanded="false" aria-labelledby="partNumberLabel selectedPartLabel">
          <span id="selectedPartLabel">Select a part number</span><span aria-hidden="true">▾</span>
        </button>
        <div id="partDropdown" class="part-dropdown" hidden>
          <input id="partSearch" type="search" autocomplete="off" aria-label="Search part numbers" placeholder="Type to search part numbers">
          <div id="partOptions" role="listbox" aria-label="Registered part numbers"></div>
          <div id="partSearchStatus" role="status"></div>
        </div>
      </div>
      <button id="startButton" class="primary" type="submit">Start production</button>
    </form>
    <div class="row">
      <button id="refreshButton" class="secondary" type="button">Refresh part list</button>
      <button id="registerButton" class="secondary" type="button">Register new part</button>
    </div>
    <div id="message" role="status"></div>
  </main>

  <section id="loginModal" class="modal" hidden>
    <form id="loginForm" class="dialog">
      <h2>Administrator login</h2>
      <p>Log in to register a new part number.</p>
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">Continue to registration</button>
      <button id="cancelLogin" class="secondary" type="button">Cancel</button>
      <div id="loginMessage" role="status"></div>
    </form>
  </section>

  <script src="/ui_helpers.js"></script>
  <script>
    const DB_API_URL = 'http://192.168.40.29:3168';
    const partPicker = document.getElementById('partPicker');
    const partPickerToggle = document.getElementById('partPickerToggle');
    const partDropdown = document.getElementById('partDropdown');
    const partOptions = document.getElementById('partOptions');
    const partNumberInput = document.getElementById('partNumber');
    const selectedPartLabel = document.getElementById('selectedPartLabel');
    const partSearch = document.getElementById('partSearch');
    const partSearchStatus = document.getElementById('partSearchStatus');
    const message = document.getElementById('message');
    let registeredPartNumbers = [];

    function renderPartOptions() {
      const matches = filterPartNumbers(registeredPartNumbers, partSearch.value);
      partOptions.replaceChildren();

      for (const partNumber of matches) {
        const option = document.createElement('button');
        option.type = 'button';
        option.className = 'part-option';
        option.setAttribute('role', 'option');
        option.setAttribute('aria-selected', String(partNumber === partNumberInput.value));
        option.textContent = partNumber;
        option.addEventListener('click', () => {
          partNumberInput.value = partNumber;
          selectedPartLabel.textContent = partNumber;
          partPickerToggle.setAttribute('aria-label', `Part number: ${partNumber}. Open to change.`);
          closePartDropdown(true);
        });
        partOptions.appendChild(option);
      }

      const query = partSearch.value.trim();
      if (matches.length === 0) {
        partSearchStatus.textContent = query
          ? `No part numbers match "${query}". Try another search.`
          : 'No registered part numbers are available.';
      } else if (query) {
        partSearchStatus.textContent = `${matches.length} matching part number${matches.length === 1 ? '' : 's'}.`;
      } else {
        partSearchStatus.textContent = `${matches.length} part number${matches.length === 1 ? '' : 's'}. Type to search.`;
      }
    }

    function closePartDropdown(returnFocus = false) {
      partDropdown.hidden = true;
      partPickerToggle.setAttribute('aria-expanded', 'false');
      if (returnFocus) partPickerToggle.focus();
    }

    function openPartDropdown() {
      if (registeredPartNumbers.length === 0) return;
      partDropdown.hidden = false;
      partPickerToggle.setAttribute('aria-expanded', 'true');
      partSearch.value = '';
      renderPartOptions();
      partSearch.focus();
    }

    partPickerToggle.addEventListener('click', () => {
      if (partDropdown.hidden) openPartDropdown();
      else closePartDropdown();
    });
    partSearch.addEventListener('input', () => {
      const matches = filterPartNumbers(registeredPartNumbers, partSearch.value);
      if (partNumberInput.value && !matches.includes(partNumberInput.value)) {
        partNumberInput.value = '';
        selectedPartLabel.textContent = 'Select a part number';
        partPickerToggle.removeAttribute('aria-label');
      }
      renderPartOptions();
    });
    partSearch.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        event.preventDefault();
        closePartDropdown(true);
      } else if (event.key === 'ArrowDown') {
        event.preventDefault();
        partOptions.querySelector('.part-option')?.focus();
      } else if (event.key === 'Enter') {
        event.preventDefault();
      }
    });
    partOptions.addEventListener('keydown', event => {
      const options = [...partOptions.querySelectorAll('.part-option')];
      const currentIndex = options.indexOf(document.activeElement);
      if (event.key === 'Escape') {
        event.preventDefault();
        closePartDropdown(true);
      } else if (event.key === 'ArrowDown' && options.length) {
        event.preventDefault();
        options[(currentIndex + 1) % options.length].focus();
      } else if (event.key === 'ArrowUp' && options.length) {
        event.preventDefault();
        options[(currentIndex - 1 + options.length) % options.length].focus();
      } else if (event.key === 'Home' && options.length) {
        event.preventDefault();
        options[0].focus();
      } else if (event.key === 'End' && options.length) {
        event.preventDefault();
        options[options.length - 1].focus();
      }
    });
    document.addEventListener('click', event => {
      if (!partPicker.contains(event.target)) closePartDropdown();
    });

    async function loadParts() {
      const startButton = document.getElementById('startButton');
      closePartDropdown();
      partPicker.hidden = true;
      startButton.disabled = true;
      registeredPartNumbers = [];
      partNumberInput.value = '';
      selectedPartLabel.textContent = 'Select a part number';
      partPickerToggle.removeAttribute('aria-label');
      partSearchStatus.textContent = '';
      partDropdown.hidden = true;
      message.textContent = '';
      message.classList.remove('error');
      try {
        const data = await fetchJson('/api/parts');
        if (!Array.isArray(data.parts)) throw new Error('The server returned an invalid part list. Please contact maintenance.');
        if (data.parts.length === 0) {
          message.textContent = 'No part numbers are registered. Select "Register new part" below to add one.';
          return;
        }
        registeredPartNumbers = data.parts.map(part => {
          if (!part || typeof part.partNumber !== 'string') {
            throw new Error('The server returned an invalid part list. Please contact maintenance.');
          }
          return part.partNumber.trim();
        }).filter(Boolean);
        if (registeredPartNumbers.length === 0) {
          message.textContent = 'No part numbers are registered. Select "Register new part" below to add one.';
          return;
        }
        partPicker.hidden = false;
        startButton.disabled = false;
        renderPartOptions();
      } catch (error) {
        registeredPartNumbers = [];
        partPicker.hidden = true;
        partSearchStatus.textContent = '';
        message.textContent = operatorErrorMessage(error);
        message.classList.add('error');
      }
    }

    document.getElementById('startForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('startButton');
      if (!partNumberInput.value) {
        message.textContent = 'Select a part number before starting production.';
        message.classList.add('error');
        return;
      }
      button.disabled = true;
      message.textContent = 'Starting run...';
      try {
        await fetchJson('/api/run/start', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            partNumber: partNumberInput.value,
            operatorName: document.getElementById('operatorName').value.trim()
          })
        });
        window.location.href = '/Production_Run.html';
      } catch (error) {
        message.textContent = operatorErrorMessage(error);
        message.classList.add('error');
        button.disabled = registeredPartNumbers.length === 0;
      }
    });

    document.getElementById('refreshButton').addEventListener('click', loadParts);
    document.getElementById('registerButton').addEventListener('click', () => {
      const loginMessage = document.getElementById('loginMessage');
      loginMessage.textContent = '';
      loginMessage.classList.remove('error');
      document.getElementById('loginModal').hidden = false;
    });
    document.getElementById('cancelLogin').addEventListener('click', () => {
      document.getElementById('loginModal').hidden = true;
    });
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const loginMessage = document.getElementById('loginMessage');
      try {
        await fetchJson(`${DB_API_URL}/login`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        window.location.href = '/Register_Part.html';
      } catch (error) {
        loginMessage.textContent = operatorErrorMessage(error);
        loginMessage.classList.add('error');
      }
    });

    loadParts();
  </script>
</body>
</html>
