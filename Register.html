<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register New Product</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <!-- Registration Card -->
    <div class="w-full max-w-2xl bg-white shadow-2xl rounded-xl p-8 space-y-6">
        <header class="text-center border-b pb-4">
            <h1 class="text-3xl font-extrabold text-indigo-700">New Product Registration</h1>
            <p class="text-gray-500 mt-2">Enter the required master data for a new production job type.</p>
        </header>

        <form id="registrationForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- 1. Customer Part Number (PN) -->
            <div>
                <label for="PN" class="block text-sm font-medium text-gray-700 mb-1">Customer P/N (PN)</label>
                <input type="text" id="PN" name="PN" required placeholder="PNCUST-009988-ZZ"
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            
            <!-- 2. Specification / Revision (Spec) -->
            <div>
                <label for="Spec" class="block text-sm font-medium text-gray-700 mb-1">Specification (Spec)</label>
                <input type="text" id="Spec" name="Spec" required placeholder="REV-Z-2026"
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <!-- 3. Max Box Quantity -->
            <div>
                <label for="Quantity" class="block text-sm font-medium text-gray-700 mb-1">Max Box Quantity</label>
                <input type="number" id="Quantity" name="Quantity" required min="1" placeholder="500"
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <!-- 4. Tray Amount (Pieces per Tray) -->
            <div>
                <label for="Tray_Amount" class="block text-sm font-medium text-gray-700 mb-1">Tray Amount (Pieces/Tray)</label>
                <input type="number" id="Tray_Amount" name="Tray_Amount" required min="1" placeholder="125"
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <!-- 5. Initial Box ID -->
            <div class="md:col-span-2">
                <label for="Box_ID" class="block text-sm font-medium text-gray-700 mb-1">Initial/Last Used Box ID (Starts next sequence)</label>
                <input type="text" id="Box_ID" name="Box_ID" required placeholder="ZZN0012005200000MY"
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500">
                <p class="mt-1 text-xs text-gray-500">This must be the full sequence ID string (e.g., Vendor+Date+Counter+Suffix).</p>
            </div>
            
            <!-- 6. Remarks -->
            <div class="md:col-span-2">
                <label for="Remarks" class="block text-sm font-medium text-gray-700 mb-1">Remarks / Special Instructions (Optional)</label>
                <textarea id="Remarks" name="Remarks" rows="2" placeholder="e.g., Requires extra handling."
                       class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500"></textarea>
            </div>

            <!-- Form Action Buttons -->
            <div class="md:col-span-2 flex justify-between space-x-4 pt-4">
                <button type="button" onclick="window.location.href='/Log_In.html'"
                        class="w-1/3 py-3 px-4 rounded-lg shadow-md text-lg font-semibold text-gray-700 bg-gray-200 hover:bg-gray-300 transition duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-400">
                    Cancel
                </button>
                <button type="submit" id="registerProductButton"
                        class="w-2/3 py-3 px-4 border border-transparent rounded-lg shadow-lg text-lg font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition disabled:opacity-50">
                    Register Product
                </button>
            </div>
        </form>
        
        <!-- Status Message Box -->
        <div id="statusMessage" class="mt-6 p-4 text-sm rounded-lg border hidden" role="alert">
            <div class="font-medium" id="statusTitle"></div>
            <div class="mt-1 text-xs" id="statusDetail"></div>
        </div>

    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const registerProductButton = document.getElementById('registerProductButton');
        const statusMessage = document.getElementById('statusMessage');
        const statusTitle = document.getElementById('statusTitle');
        const statusDetail = document.getElementById('statusDetail');

        // Note: DB_HOST and DB_PORT must match the DB_server.js configuration
        const DB_URL = 'http://192.168.40.29:3168';

        function showStatus(isSuccess, title, detail) {
            statusMessage.classList.remove('hidden', 'bg-red-100', 'border-red-400', 'text-red-700', 'bg-green-100', 'border-green-400', 'text-green-700');
            
            if (isSuccess) {
                statusMessage.classList.add('bg-green-100', 'border-green-400', 'text-green-700');
            } else {
                statusMessage.classList.add('bg-red-100', 'border-red-400', 'text-red-700');
            }

            statusTitle.textContent = title;
            statusDetail.textContent = detail;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            // Simple validation check for number fields
            if (isNaN(Number(data.Quantity)) || isNaN(Number(data.Tray_Amount))) {
                showStatus(false, 'Validation Error', 'Quantity and Tray Amount must be valid numbers.');
                return;
            }
            
            // Disable button
            registerProductButton.disabled = true;
            registerProductButton.textContent = 'Registering...';

            try {
                const response = await fetch(`${DB_URL}/register-product`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const responseData = await response.json();

                if (response.ok) {
                    showStatus(true, 'Product Registered!', 
                        `${responseData.message}. Redirecting to login screen...`);
                    
                    // On successful registration, redirect back to Log_In.html
                    setTimeout(() => {
                        window.location.href = '/Log_In.html';
                    }, 2000); 

                } else {
                    showStatus(false, 'Registration Failed', 
                        responseData.error || 'Unknown error occurred during registration.');
                }

            } catch (error) {
                console.error('Network error during registration:', error);
                showStatus(false, 'Network Error', `Could not connect to the DB server. Details: ${error.message}`);
            } finally {
                if (!response || !response.ok) {
                    registerProductButton.disabled = false;
                    registerProductButton.textContent = 'Register Product';
                }
            }
        });
    </script>
</body>
</html>
